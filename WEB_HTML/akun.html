      $('#add').textContent = tab == 'm' ? '+ Buat Akun Mahasiswa' : '+ Tambah Petugas Admin'; $('#add').className = 'b ' + (tab == 'm' ? 'p' : 'bl');
      const L = (tab == 'm' ? M : A).map((r, i) => ({ r, i })).filter(x => x.r.join(' ').toLowerCase().includes(q));
      $('#th').innerHTML = tab == 'm' ? '<tr><th>No</th><th>NIM</th><th>Nama Lengkap</th><th>Program Studi</th><th>Aksi</th></tr>' : '<tr><th>No</th><th>Username</th><th>Nama Lengkap</th><th>Peran</th><th>Aksi</th></tr>';
      $('#tb').innerHTML = L.length ? L.map((x, k) => `<tr><td>${k + 1}</td><td><b>${x.r[0]}</b></td><td class="tm">${x.r[1]}</td><td>${tab == 'm' ? x.r[2] : '<span class="role">@ADMIN</span>'}</td><td><div class="acts"><button class="b" data-r="${x.i}">Reset Password</button><button class="b r" data-d="${x.i}">Hapus</button></div></td></tr>`).join('') : '<tr><td colspan="5" class="empty">Tidak ada akun yang cocok.</td></tr>';
    }
    function mhs() {
      openM({
        icon: '🎓', title: 'Buat Akun Mahasiswa Baru', w: 550, ok: 'Buat Akun Mahasiswa →', body: `<label class="fl first" for="n1">Nomor Induk Mahasiswa (NIM) <i>*</i></label><input id="n1" placeholder="Contoh: 23010303" inputmode="numeric"><label class="fl" for="n2">Nama Lengkap &amp; Program Studi <i>*</i></label><input id="n2" placeholder="Contoh: Fajar Ramadhan (Teknik Industri)"><label class="fl" for="n3">Password Akun (Default: password123)</label><input id="n3" value="password123">`,
        onOk() {
          const n = $('#n1').value.trim(), m = $('#n2').value.trim(); $('#n1').classList.toggle('err', !n); $('#n2').classList.toggle('err', !m);
          if (!n || !m) { toast('NIM dan nama wajib diisi'); return false } if (M.some(x => x[0] == n)) { $('#n1').classList.add('err'); toast('NIM sudah terdaftar'); return false }
          const p = m.match(/^(.*?)\s*\((.*)\)\s*$/); M.push([n, p ? p[1] : m, p ? p[2] : '-']); tab = 'm'; render(); toast('Akun mahasiswa dibuat')
        }
      })
    }
    function adm() {
      openM({
        icon: LOGO, title: 'Tambah Petugas Administrator Baru', w: 550, ok: 'Simpan Akun Admin →', cls: 'bl', body: `<label class="fl first" for="a1">Username Login Admin <i>*</i></label><input id="a1" placeholder="Contoh: sarpras_andi"><label class="fl" for="a2">Nama Lengkap Petugas <i>*</i></label><input id="a2" placeholder="Contoh: Andi Wijaya, S.T."><label class="fl" for="a3">Password Admin <i>*</i></label><input id="a3" value="password123">`,
        onOk() {
          const u = $('#a1').value.trim(), n = $('#a2').value.trim(), p = $('#a3').value;['a1', 'a2', 'a3'].forEach(i => $('#' + i).classList.toggle('err', !$('#' + i).value.trim()));
          if (!u || !n || !p) { toast('Semua kolom wajib diisi'); return false } if (A.some(x => x[0] == u)) { $('#a1').classList.add('err'); toast('Username sudah dipakai'); return false }
          A.push([u, n]); tab = 'a'; render(); toast('Akun admin disimpan')
        }
      })
    }
    document.addEventListener('click', e => {
      const t = e.target.closest('[data-t]'); if (t) { tab = t.dataset.t; render(); return }
      if (e.target.id == 'add') { tab == 'm' ? mhs() : adm(); return }
      const r = e.target.closest('[data-r]'); if (r) { toast('Password direset ke password123'); return }
      const d = e.target.closest('[data-d]'); if (d) {
        const L = tab == 'm' ? M : A, i = +d.dataset.d;
        if (tab == 'a' && L.length == 1) { toast('Minimal satu admin harus tersisa'); return }
        openM({ icon: '🗑️', title: 'Hapus akun', w: 460, ok: 'Hapus', cls: 'r', body: `<p style="font-size:13px">Hapus akun <b>${L[i][1]}</b> (${L[i][0]})? Tindakan ini tidak dapat dibatalkan.</p>`, onOk() { L.splice(i, 1); render(); toast('Akun dihapus') } })
      }
    });
    $('#q').oninput = e => { q = e.target.value.toLowerCase(); render() }; render();
  </script>
</body>

</html>
